apiVersion: fabricate.dev/v1alpha1
kind: Environment
metadata:
  name: acme-valtown

# Shared Acme SaaS world. valtown is the product surface under test; Gmail,
# Asana, and HubSpot carry the same investigation needles (INV-4812, checkout
# reliability, Contoso SSO, fernworks CSV, Adatum DNS, LakeTech webhooks,
# TinyShop refund, BrightPath keys, Fabrikam SCIM) so agents can join facts
# across services.
services:
  valtown:
    resource: valtown
    scenario: valtown.acme-vals.v1
  support-mail:
    resource: gmail
    scenario: gmail.acme-corp.v1
  board:
    resource: asana
    scenario: asana.acme-sprint.v1
  crm:
    resource: hubspot
    scenario: hubspot.acme-pipeline.v1
