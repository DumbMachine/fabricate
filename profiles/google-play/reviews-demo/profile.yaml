name: reviews-demo
engine: httpmock
label: "Google Play (stateful mock — reviews backlog)"
description: |
  A stateful mock Google Play account on a random host port, backed by fab's
  httpmock engine (SQLite). Serves the subset a support-review agent uses —
  Play Developer Reporting apps:search (which apps the service account can
  see), Android Publisher reviews.list / reviews.get, and the reviews.reply
  ACTION. Seeded with three apps and a realistic unanswered-review backlog.

  Because state is real, an agent can reply to a review (reviews.reply) and the
  next reviews.list shows it as answered — the unanswered count actually drops.

  Point your Play API client's base URL at this instance and use any bearer
  token (the mock doesn't validate auth). No live Google call.

  Note: requires the local `fabricate/httpmock:local` image. Build it once
  with `make images` from the repo root.
image: fabricate/httpmock:local
env:
  # Selects which mock service this container serves.
  MOCK_SERVICE: google-play
defaults:
  # Bearer token clients authenticate with. The mock doesn't validate it;
  # it exists so clients that insist on auth have something to send.
  password: fab-play-token
seed:
  - { type: mock-fixture, file: seed.json }
tags: [mock, google-play, reviews, support, demo, stateful]
