# Replayed by the github engine AFTER the container is healthy. Each
# call hits the live emulator with `Authorization: Bearer <profile
# defaults.password>`. Calls run in order; the engine aborts on the
# first non-2xx response.
#
# Issue numbers are repo-scoped 1-based: the first POST /issues becomes
# #1, second #2, etc. The PATCH-to-close below relies on that ordering.

calls:
  # ---- Labels ------------------------------------------------------
  - method: POST
    path: /repos/octocat/hello-world/labels
    body:
      name: bug
      color: d73a4a
      description: Something isn't working

  - method: POST
    path: /repos/octocat/hello-world/labels
    body:
      name: enhancement
      color: a2eeef
      description: New feature or request

  - method: POST
    path: /repos/octocat/hello-world/labels
    body:
      name: good-first-issue
      color: 7057ff
      description: Good for newcomers

  # ---- Milestone ---------------------------------------------------
  - method: POST
    path: /repos/octocat/hello-world/milestones
    body:
      title: v1.0
      description: First production release
      due_on: "2026-06-30T00:00:00Z"

  # ---- Issues (numbered 1..5 in order below) -----------------------
  # #1 — open, bug, on the milestone
  - method: POST
    path: /repos/octocat/hello-world/issues
    body:
      title: Crash on startup
      body: |
        App SIGSEGVs on cold boot. Looks like uninitialized memory in the
        audio module — only reproduces on macOS Sequoia.
      labels: [bug]
      milestone: 1

  # #2 — open, enhancement, on the milestone
  - method: POST
    path: /repos/octocat/hello-world/issues
    body:
      title: Add dark mode
      body: "Please make the UI usable at night."
      labels: [enhancement]
      milestone: 1

  # #3 — open, good-first-issue
  - method: POST
    path: /repos/octocat/hello-world/issues
    body:
      title: "Doc typo: 'recieve' should be 'receive'"
      body: "README, line 42."
      labels: [good-first-issue]

  # #4 — opened then closed (proves PATCH + state transitions work)
  - method: POST
    path: /repos/octocat/hello-world/issues
    body:
      title: Slow on large inputs
      body: "Fixed in 2.3 — closing."
      labels: [bug]
  - method: PATCH
    path: /repos/octocat/hello-world/issues/4
    body:
      state: closed

  # #5 — open, enhancement, no milestone
  - method: POST
    path: /repos/octocat/hello-world/issues
    body:
      title: Discuss API redesign
      body: "Let's talk about v2 breaking changes."
      labels: [enhancement]
