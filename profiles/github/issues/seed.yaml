# Seed config consumed by vercel-labs/emulate at boot. Issues / labels /
# milestones aren't seedable here — they live in postseed.yaml because
# emulate's seed-config only handles users / orgs / tokens / repos.

tokens:
  ghp_fab_dev:
    login: octocat
    scopes:
      - repo
      - user
      - admin:org
  ghp_monalisa:
    login: monalisa
    scopes:
      - repo
      - user

github:
  users:
    - login: octocat
      name: The Octocat
      email: octocat@github.com
      bio: "The mascot of this fixture."
    - login: monalisa
      name: Mona Lisa
      email: monalisa@github.com
      bio: "The other mascot."

  repos:
    - owner: octocat
      name: hello-world
      description: "Demo repo for fab's github engine."
      language: JavaScript
      topics: [demo, hello-world, fab]
      auto_init: true
