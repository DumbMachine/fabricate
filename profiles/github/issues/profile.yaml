name: issues
engine: github
label: "GitHub with issues + labels + milestones"
description: |
  Two users (octocat, monalisa), one repo (octocat/hello-world) with
  topics + README, three labels (bug, enhancement, good-first-issue),
  one milestone (v1.0), and 5 issues — a mix of open + closed, some
  labelled, some assigned to the milestone. Designed to give you
  enough state to poke at every issue-flavoured endpoint without
  authoring more setup.

  Auth: bearer token `ghp_fab_dev` (scoped repo + user + admin:org)
  for octocat, and `ghp_monalisa` for the second user.

  Try:

    eval "$(fab creds <name> --env)"

    # All open issues:
    curl -H "Authorization: Bearer $FAB_PASSWORD" \
         "$FAB_URL/repos/octocat/hello-world/issues?state=open"

    # Just bugs:
    curl -H "Authorization: Bearer $FAB_PASSWORD" \
         "$FAB_URL/repos/octocat/hello-world/issues?labels=bug&state=all"

    # The milestone:
    curl -H "Authorization: Bearer $FAB_PASSWORD" \
         "$FAB_URL/repos/octocat/hello-world/milestones"

    # Create one yourself:
    curl -X POST -H "Authorization: Bearer $FAB_PASSWORD" \
         -H 'Content-Type: application/json' \
         -d '{"title":"hello","body":"from fab"}' \
         "$FAB_URL/repos/octocat/hello-world/issues"

  Note: requires the local `fabricate/emulate:local` image. Build it
  once with `make images` from the repo root.
image: fabricate/emulate:local
defaults:
  password: ghp_fab_dev
seed:
  - { type: emulate-config,   file: seed.yaml }
  - { type: emulate-postseed, file: postseed.yaml }
healthcheck:
  # postseed adds ~10 calls after boot, so give the readiness window a
  # bit more headroom than the empty profile.
  timeout: 90s
tags: [demo, issues]
