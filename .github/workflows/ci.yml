name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gmail: ${{ steps.filter.outputs.gmail }}
      asana: ${{ steps.filter.outputs.asana }}
      hubspot: ${{ steps.filter.outputs.hubspot }}
      intercom: ${{ steps.filter.outputs.intercom }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gmail:
              - 'resources/gmail/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-gmail-sdk.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            asana:
              - 'resources/asana/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-asana-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            hubspot:
              - 'resources/hubspot/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-hubspot-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            intercom:
              - 'resources/intercom/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-intercom-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet + unit tests
        run: |
          go vet ./...
          go test ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: generated bindings are current
        run: make generate-check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end smoke (real containers)
        run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/...

  gmail-sdk:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.gmail == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Google APIs Node SDK conformance
        run: make gmail-sdk
      - name: Publish verified Gmail compatibility data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- packages/docs-content/resources/integrations/_generated/gmail.compatibility.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs-content/resources/integrations/_generated/gmail.compatibility.json
          git commit -m "chore(compat): update Gmail verification"
          git push

  asana-curl:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.asana == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Asana HTTP API conformance
        run: make asana-curl
      - name: Publish verified Asana compatibility data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- packages/docs-content/resources/integrations/_generated/asana.compatibility.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs-content/resources/integrations/_generated/asana.compatibility.json
          git commit -m "chore(compat): update Asana verification"
          git push

  hubspot-curl:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.hubspot == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: HubSpot HTTP API conformance
        run: make hubspot-curl
      - name: Publish verified HubSpot compatibility data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- packages/docs-content/resources/integrations/_generated/hubspot.compatibility.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs-content/resources/integrations/_generated/hubspot.compatibility.json
          git commit -m "chore(compat): update HubSpot verification"
          git push

  intercom-curl:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.intercom == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Intercom HTTP API conformance
        run: make intercom-curl
      - name: Publish verified Intercom compatibility data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- packages/docs-content/resources/integrations/_generated/intercom.compatibility.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs-content/resources/integrations/_generated/intercom.compatibility.json
          git commit -m "chore(compat): update Intercom verification"
          git push
