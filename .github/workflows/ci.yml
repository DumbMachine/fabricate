name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gmail: ${{ steps.filter.outputs.gmail }}
      asana: ${{ steps.filter.outputs.asana }}
      hubspot: ${{ steps.filter.outputs.hubspot }}
      intercom: ${{ steps.filter.outputs.intercom }}
      attio: ${{ steps.filter.outputs.attio }}
      pipedrive: ${{ steps.filter.outputs.pipedrive }}
      close: ${{ steps.filter.outputs.close }}
      resend: ${{ steps.filter.outputs.resend }}
      mailgun: ${{ steps.filter.outputs.mailgun }}
      sendgrid: ${{ steps.filter.outputs.sendgrid }}
      mailchimp: ${{ steps.filter.outputs.mailchimp }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gmail:
              - 'resources/gmail/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-gmail-sdk.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            asana:
              - 'resources/asana/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-asana-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            hubspot:
              - 'resources/hubspot/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-hubspot-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            intercom:
              - 'resources/intercom/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-intercom-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            attio:
              - 'resources/attio/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-attio-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            pipedrive:
              - 'resources/pipedrive/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-pipedrive-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            close:
              - 'resources/close/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-close-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            resend:
              - 'resources/resend/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-resend-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            mailgun:
              - 'resources/mailgun/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-mailgun-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            sendgrid:
              - 'resources/sendgrid/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-sendgrid-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            mailchimp:
              - 'resources/mailchimp/**'
              - 'environments/**'
              - 'environment/**'
              - 'engine/http/**'
              - 'httpresource/**'
              - 'requestlog/**'
              - 'scenario/**'
              - 'cli/run.go'
              - 'scripts/test-mailchimp-curl.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet + unit tests
        run: |
          go vet ./...
          go test ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: generated bindings are current
        run: make generate-check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end smoke (real containers)
        run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/...

  gmail-sdk:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.gmail == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Google APIs Node SDK conformance
        run: make gmail-sdk
      - name: Publish verified Gmail compatibility data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- packages/docs-content/resources/integrations/_generated/gmail.compatibility.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs-content/resources/integrations/_generated/gmail.compatibility.json
          git commit -m "chore(compat): update Gmail verification"
          git push

