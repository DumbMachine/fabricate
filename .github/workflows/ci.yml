name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_examples: ${{ steps.filter.outputs.docs_examples }}
      resources: ${{ steps.matrix.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect docs-examples path changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$(printf '%s' "$base" | tr -d '0')" = "" ]; then
            echo "docs_examples=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_examples=false
          while IFS= read -r line; do
            case "$line" in
              cmd/docsexamples/*|internal/docsexamples/*|packages/docs-content/resources/_examples/*|resources/*|environments/*|environment/*|engine/http/*|httpresource/*|requestlog/*|scenario/*|cli/run.go|Makefile|.github/workflows/ci.yml)
                docs_examples=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames --relative "$base"...HEAD)
          echo "docs_examples=$docs_examples" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Select changed conformance resources
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          ids=$(./scripts/test.sh --changed-since "$base")
          json=$(printf '%s\n' "$ids" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')
          echo "resources=$json" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet + unit tests
        run: |
          go vet ./...
          go test ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: generated bindings and operation catalogs are current
        run: make generate-check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end smoke (real containers)
        run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/...

  conformance:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.resources != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.changes.outputs.resources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resource conformance
        run: make conformance ${{ matrix.resource }}
      - name: Compatibility snapshot is current
        run: git diff --exit-code -- packages/docs-content/resources/_generated/${{ matrix.resource }}.compatibility.json

  docs-examples:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.docs_examples == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Capture dirty documented command output
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$(echo "$base" | tr -d '0')" = "" ]; then
            make docs-examples DOCS_EXAMPLES_FLAGS=--all
          else
            make docs-examples DOCS_EXAMPLES_FLAGS="--since-ref $base"
          fi
      - name: Command snapshots are current
        run: git diff --exit-code -- packages/docs-content/resources/_generated ':(exclude)packages/docs-content/resources/_generated/*.compatibility.json' ':(exclude)packages/docs-content/resources/_generated/*.operations.json'
