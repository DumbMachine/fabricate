# Publishes cross-platform fab binaries on every v* tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Cross-compile the `fab` CLI and attach the archives to the GitHub
  # release, so `install.sh` (curl | sh) can fetch them.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload the binary archives
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs tags + history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
