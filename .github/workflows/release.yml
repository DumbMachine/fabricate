# Publishes the engine images to GHCR on every v* tag. The packages
# land as ghcr.io/<owner>/fabricate-httpmock and fabricate-emulate,
# tagged with the release version and `latest`.
#
# First-time setup: after the first run, make both packages public in
# the GitHub UI (Packages → package → settings) so `fab` users can
# pull them anonymously. See docs/releasing.md for the full flow.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Cross-compile the `fab` CLI and attach the archives to the GitHub
  # release, so `install.sh` (curl | sh) can fetch them. GoReleaser pins
  # each binary's default engine image to this tag's GHCR copy via
  # -ldflags (see .goreleaser.yaml), so a released binary auto-pulls with
  # no `make images`.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload the binary archives
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs tags + history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker image names must be lowercase; github.repository_owner
      # preserves the account's casing (e.g. DumbMachine), so lowercase
      # it here.
      - name: compute image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: push httpmock image
        uses: docker/build-push-action@v6
        with:
          context: mockd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/fabricate-httpmock:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/fabricate-httpmock:latest
      - name: push emulate image
        uses: docker/build-push-action@v6
        with:
          context: engine/github
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/fabricate-emulate:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/fabricate-emulate:latest
