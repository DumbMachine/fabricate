name: rideshare-ops
engine: httpmock
label: "Rideshare ops board — the payments incident, mid-response"
description: |
  Wheelio's OPS board (examples/rideshare suite). The urgent issue is
  OPS-301: the payments-webhook v2.4.1 rollout is stuck because the
  image tag was never pushed — exactly the broken Deployment in
  k8s/rideshare.yaml, and the reason rideshare-core has 14 unpaid
  trips and rideshare-support has an angry backlog.

  An agent can work the incident end to end: read OPS-301 and its
  comment trail, verify blast radius in postgres, kubectl the broken
  rollout, then issueUpdate / commentCreate as it makes progress.

  Requires the fabricate httpmock image (`make images` once).
env:
  MOCK_SERVICE: linear
defaults:
  password: fab-wheelio-ops
seed:
  - { type: mock-fixture, file: seed.json }
tags: [example, rideshare, ops, linear, incident, stateful]
