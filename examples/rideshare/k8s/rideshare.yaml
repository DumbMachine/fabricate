# Wheelio's "microservices", sized for a local kind/k3s cluster.
# Three Deployments; payments-webhook is INTENTIONALLY broken — its
# image tag was never pushed (that's the incident the whole
# examples/rideshare suite is about), so it sits in ImagePullBackOff:
#
#   kubectl -n rideshare get pods
#   kubectl -n rideshare describe pod -l app=payments-webhook | tail -5
#   kubectl -n rideshare rollout status deploy/payments-webhook   # hangs
#
# The "fix" (what OPS-301 debates) is a rollback. ghcr.io/wheelio/*
# isn't a real registry, so in the demo stand in for v2.4.0 with any
# real image and watch the rollout actually go Ready:
#   kubectl -n rideshare set image deploy/payments-webhook webhook=nginx:1.27-alpine
#   kubectl -n rideshare rollout status deploy/payments-webhook
apiVersion: v1
kind: Namespace
metadata:
  name: rideshare
  labels: { app.kubernetes.io/part-of: wheelio }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rideshare
  labels: { app: api-gateway, app.kubernetes.io/part-of: wheelio }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rideshare
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-matcher
  namespace: rideshare
  labels: { app: trip-matcher, app.kubernetes.io/part-of: wheelio }
spec:
  replicas: 1
  selector: { matchLabels: { app: trip-matcher } }
  template:
    metadata: { labels: { app: trip-matcher } }
    spec:
      containers:
        - name: matcher
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do echo "matcher: scanning dispatch queue $(date -Iseconds)"; sleep 20; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
# THE BROKEN ONE. ghcr.io/wheelio/payments-webhook:v2.4.1 does not
# exist (CI failed at the push step; the deploy ran anyway), so this
# rollout never becomes Ready → ImagePullBackOff. Since the old
# ReplicaSet is gone, captures are down entirely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-webhook
  namespace: rideshare
  labels: { app: payments-webhook, app.kubernetes.io/part-of: wheelio }
  annotations:
    wheelio.example/deployed-by: "ci-pipeline #8841"
    wheelio.example/deployed-at: "2026-07-03T14:05:00Z"
spec:
  replicas: 1
  selector: { matchLabels: { app: payments-webhook } }
  template:
    metadata: { labels: { app: payments-webhook } }
    spec:
      containers:
        - name: webhook
          image: ghcr.io/wheelio/payments-webhook:v2.4.1
          ports: [{ containerPort: 8443 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payments-webhook
  namespace: rideshare
spec:
  selector: { app: payments-webhook }
  ports: [{ port: 8443, targetPort: 8443 }]
