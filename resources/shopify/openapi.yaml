openapi: 3.0.3
info:
  title: Fabricate Shopify Admin API
  version: "2024-10"
  description: >-
    Curated Shopify Admin REST 2024-10 contract. Paths are the public Admin
    REST paths. The surface covers shop, products, variants, customers, orders,
    fulfillments, and refunds. Undeclared Admin operations are not advertised.
servers:
  - url: https://acme-goods.myshopify.com
    description: Acme Goods
  - url: https://northwind-market.myshopify.com
    description: Northwind Market
  - url: https://tinyshop.myshopify.com
    description: TinyShop
  - url: https://fernworks-studio.myshopify.com
    description: Fernworks Studio
security:
  - bearerAuth: []
  - shopifyAccessToken: []
tags:
  - name: Shop
  - name: Products
  - name: Variants
  - name: Customers
  - name: Orders
  - name: Fulfillments
  - name: Refunds
paths:
  /admin/api/2024-10/shop.json:
    get:
      operationId: shopify.shop.get
      summary: Retrieve the shop for the request host.
      tags: [Shop]
      responses:
        "200":
          description: Shop configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShopEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/products.json:
    get:
      operationId: shopify.products.list
      summary: List products for the shop.
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductList"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: shopify.products.create
      summary: Create a product.
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductCreate"}
      responses:
        "201":
          description: Created product.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/products/{product_id}.json:
    get:
      operationId: shopify.products.get
      summary: Retrieve a product.
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/variants/{variant_id}.json:
    get:
      operationId: shopify.variants.get
      summary: Retrieve a product variant.
      tags: [Variants]
      parameters:
        - $ref: "#/components/parameters/VariantId"
      responses:
        "200":
          description: Variant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VariantEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/customers.json:
    get:
      operationId: shopify.customers.list
      summary: List customers for the shop.
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerList"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/customers/{customer_id}.json:
    get:
      operationId: shopify.customers.get
      summary: Retrieve a customer.
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/orders.json:
    get:
      operationId: shopify.orders.list
      summary: List orders for the shop.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrderStatus"
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderList"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: shopify.orders.create
      summary: Create an order.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderCreate"}
      responses:
        "201":
          description: Created order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/orders/{order_id}.json:
    get:
      operationId: shopify.orders.get
      summary: Retrieve an order.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/orders/{order_id}/fulfillments.json:
    get:
      operationId: shopify.orders.fulfillments.list
      summary: List fulfillments for an order.
      tags: [Fulfillments]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Fulfillments.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FulfillmentList"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/fulfillments.json:
    post:
      operationId: shopify.fulfillments.create
      summary: Create a fulfillment.
      tags: [Fulfillments]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FulfillmentCreate"}
      responses:
        "201":
          description: Created fulfillment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FulfillmentEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /admin/api/2024-10/orders/{order_id}/refunds.json:
    get:
      operationId: shopify.orders.refunds.list
      summary: List refunds for an order.
      tags: [Refunds]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Refunds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefundList"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: shopify.orders.refunds.create
      summary: Create a refund.
      tags: [Refunds]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefundCreate"}
      responses:
        "201":
          description: Created refund.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefundEnvelope"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Synthetic bearer token. Fabricate's proxy sends this header.
    shopifyAccessToken:
      type: apiKey
      in: header
      name: X-Shopify-Access-Token
      description: Shopify Admin API access token header.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of results to return. Default 50.
      schema: {type: integer, minimum: 1, maximum: 250}
    OrderStatus:
      name: status
      in: query
      description: open, closed, cancelled, or any. Default open, matching Admin REST.
      schema: {type: string, enum: [open, closed, cancelled, any]}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: integer, format: int64}
    VariantId:
      name: variant_id
      in: path
      required: true
      schema: {type: integer, format: int64}
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: {type: integer, format: int64}
    OrderId:
      name: order_id
      in: path
      required: true
      schema: {type: integer, format: int64}
  responses:
    Error:
      description: Shopify-style error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [errors]
      properties:
        errors: {type: string}
    ShopEnvelope:
      type: object
      required: [shop]
      properties:
        shop: {$ref: "#/components/schemas/Shop"}
    Shop:
      type: object
      required: [id, name, email, domain, myshopify_domain, shop_owner, currency, country, country_code, country_name, iana_timezone, timezone, money_format, primary_locale, weight_unit, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        email: {type: string}
        domain: {type: string}
        myshopify_domain: {type: string}
        shop_owner: {type: string}
        phone: {type: string}
        currency: {type: string}
        money_format: {type: string}
        primary_locale: {type: string}
        iana_timezone: {type: string}
        timezone: {type: string}
        country: {type: string}
        country_code: {type: string}
        country_name: {type: string}
        province: {type: string}
        province_code: {type: string}
        city: {type: string}
        address1: {type: string}
        zip: {type: string}
        weight_unit: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
    ProductList:
      type: object
      required: [products]
      properties:
        products: {type: array, items: {$ref: "#/components/schemas/Product"}}
    ProductEnvelope:
      type: object
      required: [product]
      properties:
        product: {$ref: "#/components/schemas/Product"}
    Product:
      type: object
      required: [id, title, vendor, status, handle, created_at, updated_at, variants, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        vendor: {type: string}
        product_type: {type: string}
        status: {type: string}
        handle: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        admin_graphql_api_id: {type: string}
        variants: {type: array, items: {$ref: "#/components/schemas/Variant"}}
    VariantEnvelope:
      type: object
      required: [variant]
      properties:
        variant: {$ref: "#/components/schemas/Variant"}
    Variant:
      type: object
      required: [id, product_id, title, price, sku, position, requires_shipping, taxable, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        product_id: {type: integer, format: int64}
        title: {type: string}
        price: {type: string}
        sku: {type: string}
        position: {type: integer}
        inventory_quantity: {type: integer}
        inventory_management: {type: string}
        requires_shipping: {type: boolean}
        taxable: {type: boolean}
        weight_unit: {type: string}
        admin_graphql_api_id: {type: string}
    ProductCreate:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product:
          type: object
          additionalProperties: false
          required: [title]
          properties:
            title: {type: string, minLength: 1}
            vendor: {type: string}
            product_type: {type: string}
            status: {type: string}
            variants:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  title: {type: string}
                  price: {type: string}
                  sku: {type: string}
                  inventory_quantity: {type: integer, minimum: 0}
    CustomerList:
      type: object
      required: [customers]
      properties:
        customers: {type: array, items: {$ref: "#/components/schemas/Customer"}}
    CustomerEnvelope:
      type: object
      required: [customer]
      properties:
        customer: {$ref: "#/components/schemas/Customer"}
    Customer:
      type: object
      required: [id, email, first_name, last_name, orders_count, total_spent, currency, state, verified_email, created_at, updated_at, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        email: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        phone: {type: string}
        orders_count: {type: integer, minimum: 0}
        total_spent: {type: string}
        currency: {type: string}
        state: {type: string}
        verified_email: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
        admin_graphql_api_id: {type: string}
    OrderList:
      type: object
      required: [orders]
      properties:
        orders: {type: array, items: {$ref: "#/components/schemas/Order"}}
    OrderEnvelope:
      type: object
      required: [order]
      properties:
        order: {$ref: "#/components/schemas/Order"}
    Order:
      type: object
      required: [id, name, order_number, created_at, updated_at, currency, financial_status, total_price, subtotal_price, total_tax, total_discounts, current_total_price, line_items, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        order_number: {type: integer, format: int64}
        email: {type: string}
        phone: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        currency: {type: string}
        financial_status: {type: string}
        fulfillment_status: {type: string}
        total_price: {type: string}
        subtotal_price: {type: string}
        total_tax: {type: string}
        total_discounts: {type: string}
        current_total_price: {type: string}
        payment_gateway_names: {type: array, items: {type: string}}
        note: {type: string}
        note_attributes: {type: array, items: {$ref: "#/components/schemas/NoteAttribute"}}
        customer: {$ref: "#/components/schemas/Customer"}
        line_items: {type: array, items: {$ref: "#/components/schemas/LineItem"}}
        shipping_address: {$ref: "#/components/schemas/Address"}
        billing_address: {$ref: "#/components/schemas/Address"}
        admin_graphql_api_id: {type: string}
    LineItem:
      type: object
      required: [id, title, name, quantity, price, requires_shipping, taxable]
      properties:
        id: {type: integer, format: int64}
        variant_id: {type: integer, format: int64}
        product_id: {type: integer, format: int64}
        title: {type: string}
        name: {type: string}
        sku: {type: string}
        quantity: {type: integer}
        price: {type: string}
        fulfillment_status: {type: string}
        requires_shipping: {type: boolean}
        taxable: {type: boolean}
    Address:
      type: object
      required: [address1, city, country, country_code, zip]
      properties:
        first_name: {type: string}
        last_name: {type: string}
        address1: {type: string}
        city: {type: string}
        province: {type: string}
        province_code: {type: string}
        country: {type: string}
        country_code: {type: string}
        zip: {type: string}
        phone: {type: string}
    NoteAttribute:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string}
    OrderCreate:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          type: object
          additionalProperties: false
          required: [line_items]
          properties:
            email: {type: string}
            phone: {type: string}
            currency: {type: string}
            financial_status: {type: string}
            note: {type: string}
            customer:
              type: object
              additionalProperties: false
              properties:
                first_name: {type: string}
                last_name: {type: string}
                email: {type: string}
                phone: {type: string}
            shipping_address: {$ref: "#/components/schemas/AddressInput"}
            line_items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [quantity]
                properties:
                  variant_id: {type: integer, format: int64}
                  title: {type: string}
                  price: {type: string}
                  sku: {type: string}
                  quantity: {type: integer, minimum: 1}
    AddressInput:
      type: object
      additionalProperties: false
      properties:
        first_name: {type: string}
        last_name: {type: string}
        address1: {type: string}
        city: {type: string}
        province: {type: string}
        province_code: {type: string}
        country: {type: string}
        country_code: {type: string}
        zip: {type: string}
        phone: {type: string}
    FulfillmentList:
      type: object
      required: [fulfillments]
      properties:
        fulfillments: {type: array, items: {$ref: "#/components/schemas/Fulfillment"}}
    FulfillmentEnvelope:
      type: object
      required: [fulfillment]
      properties:
        fulfillment: {$ref: "#/components/schemas/Fulfillment"}
    Fulfillment:
      type: object
      required: [id, order_id, status, created_at, updated_at, service, line_items, name, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        order_id: {type: integer, format: int64}
        status: {type: string}
        shipment_status: {type: string}
        tracking_company: {type: string}
        tracking_number: {type: string}
        tracking_numbers: {type: array, items: {type: string}}
        tracking_url: {type: string}
        tracking_urls: {type: array, items: {type: string}}
        created_at: {type: string}
        updated_at: {type: string}
        service: {type: string}
        name: {type: string}
        origin_address: {$ref: "#/components/schemas/OriginAddress"}
        line_items: {type: array, items: {$ref: "#/components/schemas/LineItem"}}
        admin_graphql_api_id: {type: string}
    OriginAddress:
      type: object
      required: [country_code]
      properties:
        address1: {type: string}
        city: {type: string}
        province_code: {type: string}
        country_code: {type: string}
        zip: {type: string}
    FulfillmentCreate:
      type: object
      additionalProperties: false
      required: [fulfillment]
      properties:
        fulfillment:
          type: object
          additionalProperties: false
          required: [line_items_by_fulfillment_order]
          properties:
            notify_customer: {type: boolean}
            tracking_info:
              type: object
              additionalProperties: false
              properties:
                company: {type: string}
                number: {type: string}
                url: {type: string}
            line_items_by_fulfillment_order:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [fulfillment_order_id]
                properties:
                  fulfillment_order_id: {type: integer, format: int64}
    RefundList:
      type: object
      required: [refunds]
      properties:
        refunds: {type: array, items: {$ref: "#/components/schemas/Refund"}}
    RefundEnvelope:
      type: object
      required: [refund]
      properties:
        refund: {$ref: "#/components/schemas/Refund"}
    Refund:
      type: object
      required: [id, order_id, created_at, processed_at, refund_line_items, transactions, admin_graphql_api_id]
      properties:
        id: {type: integer, format: int64}
        order_id: {type: integer, format: int64}
        created_at: {type: string}
        processed_at: {type: string}
        note: {type: string}
        admin_graphql_api_id: {type: string}
        refund_line_items: {type: array, items: {$ref: "#/components/schemas/RefundLineItem"}}
        transactions: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
    RefundLineItem:
      type: object
      required: [id, line_item_id, quantity, restock_type, subtotal, line_item]
      properties:
        id: {type: integer, format: int64}
        line_item_id: {type: integer, format: int64}
        quantity: {type: integer}
        restock_type: {type: string}
        subtotal: {type: string}
        line_item: {$ref: "#/components/schemas/LineItem"}
    Transaction:
      type: object
      required: [id, order_id, kind, gateway, status, amount, currency, created_at]
      properties:
        id: {type: integer, format: int64}
        order_id: {type: integer, format: int64}
        kind: {type: string}
        gateway: {type: string}
        status: {type: string}
        amount: {type: string}
        currency: {type: string}
        authorization: {type: string}
        created_at: {type: string}
    RefundCreate:
      type: object
      additionalProperties: false
      required: [refund]
      properties:
        refund:
          type: object
          additionalProperties: false
          properties:
            note: {type: string}
            currency: {type: string}
            notify: {type: boolean}
            refund_line_items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [line_item_id, quantity]
                properties:
                  line_item_id: {type: integer, format: int64}
                  quantity: {type: integer, minimum: 1}
                  restock_type: {type: string}
            transactions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [amount, kind]
                properties:
                  amount: {type: string}
                  kind: {type: string}
                  gateway: {type: string}
                  parent_id: {type: integer, format: int64}
