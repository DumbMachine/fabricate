{
  "openapi": "3.0.3",
  "info": {
    "title": "LinkedIn curated publishing API",
    "version": "v1"
  },
  "servers": [
    {
      "url": "https://api.linkedin.com"
    }
  ],
  "paths": {
    "/rest/posts": {
      "post": {
        "operationId": "createPost",
        "parameters": [],
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {},
                  "required": [],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "Provider error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 12000
                    }
                  },
                  "required": [
                    "message"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "author": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  },
                  "commentary": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 3000
                  },
                  "visibility": {
                    "type": "string",
                    "enum": [
                      "PUBLIC"
                    ]
                  },
                  "distribution": {
                    "type": "object",
                    "properties": {
                      "feedDistribution": {
                        "type": "string",
                        "enum": [
                          "MAIN_FEED"
                        ]
                      },
                      "targetEntities": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {},
                          "required": [],
                          "additionalProperties": false
                        }
                      },
                      "thirdPartyDistributionChannels": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 12000
                        }
                      }
                    },
                    "required": [
                      "feedDistribution",
                      "targetEntities",
                      "thirdPartyDistributionChannels"
                    ],
                    "additionalProperties": false
                  },
                  "lifecycleState": {
                    "type": "string",
                    "enum": [
                      "PUBLISHED"
                    ]
                  },
                  "isReshareDisabledByAuthor": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "author",
                  "commentary",
                  "visibility",
                  "distribution",
                  "lifecycleState",
                  "isReshareDisabledByAuthor"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      },
      "get": {
        "operationId": "findPosts",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          },
          {
            "name": "author",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "elements": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 200
                          },
                          "author": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 200
                          },
                          "commentary": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 3000
                          },
                          "lifecycleState": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 30
                          }
                        },
                        "required": [
                          "id",
                          "author",
                          "commentary",
                          "lifecycleState"
                        ],
                        "additionalProperties": false
                      }
                    }
                  },
                  "required": [
                    "elements"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "Provider error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 12000
                    }
                  },
                  "required": [
                    "message"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        }
      }
    },
    "/rest/posts/{postId}": {
      "get": {
        "operationId": "getPost",
        "parameters": [
          {
            "name": "postId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 200
                    },
                    "author": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 200
                    },
                    "commentary": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 3000
                    },
                    "lifecycleState": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 30
                    }
                  },
                  "required": [
                    "id",
                    "author",
                    "commentary",
                    "lifecycleState"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "Provider error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 12000
                    }
                  },
                  "required": [
                    "message"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        }
      }
    }
  }
}
